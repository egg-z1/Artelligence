spring.application.name=Artelligence Backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/artelligence}
spring.datasource.username=${DB_USERNAME:artelligence}
spring.datasource.password=${DB_PASSWORD:artelligence}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.port=${SERVER_PORT:8081}
