services:
  postgres:
    image: postgres:17.11
    container_name: artelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artelligence}
      POSTGRES_USER: ${POSTGRES_USER:-artelligence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artelligence} -d ${POSTGRES_DB:-artelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
