services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artelligence}
      POSTGRES_USER: ${POSTGRES_USER:-artelligence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artelligence} -d ${POSTGRES_DB:-artelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["local-qa"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-qa
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-artelligence}
      DB_USERNAME: ${POSTGRES_USER:-artelligence}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-artelligence}
      SERVER_PORT: 8080
      LOCAL_QA_PUBLIC_BASE_URL: http://localhost:${APP_PORT:-8080}
      REST_CORS_ALLOWED_ORIGINS: ${REST_CORS_ALLOWED_ORIGINS:-http://localhost:5000}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:5000}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
